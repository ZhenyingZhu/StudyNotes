services:
  workspace:
    image: itemorganizer-workspace:local
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
      args:
        DOTNET_SDK_VERSION: ${DOTNET_SDK_VERSION}
        DOTNET_EF_VERSION: ${DOTNET_EF_VERSION}
        NODE_VERSION: ${NODE_VERSION}
        PNPM_VERSION: ${PNPM_VERSION}
        AZURE_CLI_VERSION: ${AZURE_CLI_VERSION}
        BICEP_VERSION: ${BICEP_VERSION}
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ITEMORGANIZER_DATABASE_CONNECTION: ${ITEMORGANIZER_DATABASE_CONNECTION}
      ITEMORGANIZER_STORAGE_CONNECTION: ${ITEMORGANIZER_STORAGE_CONNECTION}
    volumes:
      - .:/workspace:cached
      - nuget-cache:/home/node/.nuget/packages
      - pnpm-store:/home/node/.local/share/pnpm/store
    ports:
      - "5000:5000"
      - "5173:5173"
    working_dir: /workspace
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_healthy

  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE}
    ports:
      - "54320:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  azurite:
    image: ${AZURITE_IMAGE}
    command: >
      azurite
      --blobHost 0.0.0.0
      --queueHost 0.0.0.0
      --tableHost 0.0.0.0
      --location /data
      --debug /data/debug.log
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:10000/devstoreaccount1?comp=list', response => process.exit(response.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
  azurite-data:
  nuget-cache:
  pnpm-store:
