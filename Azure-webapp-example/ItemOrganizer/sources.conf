# Checked-in active source manifest. Native source-file examples are in docs/source-examples.
# Examples are never loaded as runtime defaults or fallbacks.
# Only NuGet and npm accept external source configuration files.
NUGET_CONFIG=D:\ItemOrganizerConfig\NuGet.Config
NPM_CONFIG=D:\ItemOrganizerConfig\.npmrc

# All other source values are configured directly in this manifest.
# apt uses generated native configuration; suites follow the host/image release.
UBUNTU_APT_ARCHIVE_URI=https://archive.ubuntu.com/ubuntu/
UBUNTU_APT_SECURITY_URI=https://security.ubuntu.com/ubuntu/
UBUNTU_APT_PORTS_URI=https://ports.ubuntu.com/ubuntu-ports/
WORKSPACE_APT_URI=https://deb.debian.org/debian
WORKSPACE_APT_SECURITY_URI=https://deb.debian.org/debian-security
DOCKER_APT_URI=https://download.docker.com/linux/ubuntu
AZURE_CLI_APT_URI=https://packages.microsoft.com/repos/azure-cli/
DOCKER_SIGNING_KEY_URI=https://download.docker.com/linux/ubuntu/gpg
AZURE_CLI_SIGNING_KEY_URI=https://packages.microsoft.com/keys/microsoft.asc

# Docker pulls repository-pinned images from these registries.
WORKSPACE_REGISTRY=mcr.microsoft.com
POSTGRES_REGISTRY=docker.io
AZURITE_REGISTRY=mcr.microsoft.com

# Windows prerequisite installation sources.
# Artifact versions and architecture selection belong in the installer.
WSL_RELEASE_BASE_URI=https://github.com/microsoft/WSL/releases/download
UBUNTU_WSL_BASE_URI=https://cloud-images.ubuntu.com/wsl/

# The native .NET installer receives the configured feed and pinned SDK version.
DOTNET_INSTALL_SCRIPT_URI=https://dot.net/v1/dotnet-install.sh
DOTNET_INSTALL_FEED_URI=https://builds.dotnet.microsoft.com/dotnet

# Standalone Bicep and optional native Playwright browser downloads.
BICEP_RELEASE_BASE_URI=https://downloads.bicep.azure.com
PLAYWRIGHT_DOWNLOAD_HOST=https://cdn.playwright.dev
